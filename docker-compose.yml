services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: pluto_migrator
      POSTGRES_DB: pluto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 infra/configure-local.py first}
      PLUTO_DB_PASSWORD: ${PLUTO_DB_PASSWORD:?Run python3 infra/configure-local.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-db.sh:/docker-entrypoint-initdb.d/01-pluto.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pluto_migrator -d pluto"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
    command: [alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
  api:
    build: ./apps/api
    environment: &api_environment
      DATABASE_URL: ${DATABASE_URL}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      MAIL_DIRECTORY: /app/.dev-mail
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - dev_mail:/app/.dev-mail
      - objects:/app/.objects
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build: ./apps/api
    profiles: [processing]
    environment:
      <<: *api_environment
      WORKER_INSTITUTION: ${WORKER_INSTITUTION:-}
    command: [python, -m, pluto.worker]
    volumes:
      - objects:/app/.objects
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  dev_mail:
  objects:
